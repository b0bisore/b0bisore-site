<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 閻魔帳（死者の台帳）をモチーフにした一枚の縦長カード。上に六道の輪、下に記録 */
:root{
  --paper:#E9ECF1; --surface:#F8F9FB; --ink:#1B2232; --muted:#454D61; --line:#CCD2DD; --shu:#B3302A; --shu-soft:#B3302A1A;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F121A; --surface:#171B26; --ink:#E6E8EE; --muted:#B6BCC9; --line:#2A3041; --shu:#E2705C; --shu-soft:#E2705C22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F121A; --surface:#171B26; --ink:#E6E8EE; --muted:#B6BCC9; --line:#2A3041; --shu:#E2705C; --shu-soft:#E2705C22; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
/* 日本語は文節の切れ目で改行する（対応ブラウザのみ。非対応なら通常の改行） */
:root[lang="ja"] body{word-break:auto-phrase}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:22px}

header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.title{flex:1;min-width:0}
.wheel{width:64px;height:64px;flex:none;color:var(--shu)}
.wheel.spin{animation:spin 1.1s cubic-bezier(.3,.1,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,42px);line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex:none}
.lang button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:4px 12px;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lang button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:4px;background:var(--surface);gap:4px}
.modes button{font:inherit;font-weight:700;border:0;border-radius:7px;padding:10px 8px;background:transparent;color:var(--muted);cursor:pointer}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.modes button:focus-visible,.roll:focus-visible,summary:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.intro{margin:0;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
/* 横向きの漏斗：左から右へ帯が細くなり、脊椎動物の先で3本に分かれる */
.funnel{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:4px;height:156px}
.lv{position:relative;display:block;min-width:0;cursor:pointer}
.lv input{position:absolute;opacity:0;pointer-events:none}
.lv>span{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;height:100%;padding:4px 3px;border:1px solid var(--line);border-radius:6px;background:var(--surface);transition:background .2s,color .2s,opacity .2s}
.lv b{font-size:13px;line-height:1.25;overflow-wrap:anywhere;hyphens:manual}
.lv small{display:block;margin-top:2px;font-size:11.5px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums}
.lv:hover>span{border-color:var(--shu)}
.lv.passed>span{background:var(--shu-soft);border-color:transparent}
.lv.off>span{opacity:.45}
.lv input:checked+span{background:var(--shu);border-color:var(--shu);color:#fff}
.lv input:checked+span small{color:#fff}
.lv input:focus-visible+span{outline:2px solid var(--shu);outline-offset:2px}
.trunk{grid-row:1/4;align-self:center}
.trunk[data-i="0"]{grid-column:1;height:100%}
.trunk[data-i="1"]{grid-column:2;height:86%}
.trunk[data-i="2"]{grid-column:3;height:72%}
.trunk[data-i="3"]{grid-column:4;height:60%}
.br{grid-column:5}
.br[data-r="1"]{grid-row:1}.br[data-r="2"]{grid-row:2}.br[data-r="3"]{grid-row:3}
.tip{grid-column:6;grid-row:2;height:86%;align-self:center}
/* 枝分かれの線 */
.spine{grid-column:5;grid-row:1/4;position:relative;pointer-events:none}
.spine::before{content:"";position:absolute;left:-4px;top:calc(100% / 6);bottom:calc(100% / 6);border-left:2px solid var(--line)}
.br::before,.tip::before{content:"";position:absolute;left:-5px;top:50%;width:5px;border-top:2px solid var(--line)}
.spine.on::before,.br.on::before,.tip.on::before{border-color:var(--shu)}
.scope-info{display:grid;gap:2px;padding:10px 14px;border-left:3px solid var(--shu);background:var(--surface);border-radius:0 6px 6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.scope-info b{font-size:15px}
.scope-info .digits{display:block}

.roll{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.2em;padding:16px;border-radius:12px;border:0;background:var(--shu);color:#fff;cursor:pointer;transition:transform .12s, filter .12s}
.roll:hover{filter:brightness(1.07)}
.roll:active{transform:scale(.98)}
.roll:disabled{opacity:.6;cursor:wait}

.ledger{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;min-height:260px}
.ledger::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.ledger-title{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.3em}
.ledger-no{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seal{position:absolute;right:18px;top:52px;width:64px;height:64px;border:3px solid var(--shu);border-radius:6px;color:var(--shu);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;writing-mode:vertical-rl;letter-spacing:.1em;transform:rotate(-8deg);opacity:.85}
.seal.stamp{animation:stamp .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.85}}

.row{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row dt{font-family:var(--display);font-weight:800;font-size:16px;color:var(--shu);letter-spacing:.2em;padding-top:4px}
.row dd{margin:0;min-width:0;padding-right:70px}
.row:nth-child(n+2) dd{padding-right:0}
.creature{display:flex;align-items:center;gap:14px}
.emoji{font-size:52px;line-height:1;flex:none;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.wiki{display:inline-block;margin-top:4px;font-size:14px;color:var(--shu);text-decoration:none;border-bottom:1px solid currentColor}
.wiki:hover{border-bottom-width:2px}
.wiki:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.scale{position:relative;height:58px;margin:8px 4px 0}
.scale .track{position:absolute;left:0;right:0;top:27px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line),var(--muted))}
.scale .tick{position:absolute;top:23px;width:1px;height:12px;background:var(--muted)}
.scale .tl{position:absolute;font-size:12px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.scale .tl.hi{top:2px}.scale .tl.lo{top:38px}
.scale .mk{position:absolute;top:21px;width:16px;height:16px;border-radius:50%;background:var(--shu);border:3px solid var(--surface);transform:translateX(-50%);box-shadow:0 0 0 1px var(--shu)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;margin:0 4px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(22px,5.6vw,30px);line-height:1.3;display:block;text-wrap:balance}
.big.mid{font-size:clamp(18px,4.6vw,22px)}
.note{display:block;color:var(--muted);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;color:var(--muted);vertical-align:2px}
.reveal{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.placeholder{color:var(--muted);padding:40px 0 20px;text-align:center;font-size:14px}

.history h2{font-family:var(--display);font-size:15px;margin:0 0 8px;letter-spacing:.15em}
.history ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:14px}
.history li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:0}
.history li span:first-child{color:var(--muted)}
.history li>span:last-child{color:var(--muted);text-align:right}

details.table{border-top:1px solid var(--line);padding-top:12px}
details.table summary{cursor:pointer;font-weight:700;font-size:15px}
.tbl{margin-top:10px;display:grid;gap:0;font-size:14px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,13em);gap:10px;padding:5px 0;border-bottom:1px solid var(--line);align-items:center}
.tr .bar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.tr .bar i{display:block;height:100%;background:var(--shu)}
.tr .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin:0}

.calc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.calc h2{font-family:var(--display);font-size:16px;margin:0 0 4px;letter-spacing:.15em}
.calc .lead{margin:0 0 12px;font-size:14px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps>li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:10px;counter-increment:s}
.steps>li::before{content:counter(s);font-family:var(--display);font-weight:800;color:var(--surface);background:var(--shu);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;font-size:13px;margin-top:2px}
.steps h3{margin:0;font-size:15px}
.steps p{margin:4px 0 0;font-size:14px}
.formula{display:block;margin-top:6px;background:var(--paper);border-radius:4px;padding:8px 12px;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--shu)}
.cands{margin-top:6px;display:grid;font-size:14px}
.cands div{display:grid;grid-template-columns:minmax(0,1fr) minmax(5em,50%);gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cands div span:last-child{text-align:right;color:var(--muted)}
.cands .hit{color:var(--shu);font-weight:700}
.cands .hit span:last-child{color:var(--shu)}
.cands i{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:2px}
.cands i u{display:block;height:100%;background:var(--muted);border-radius:2px}
.cands .hit i u{background:var(--shu)}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.share-label{width:100%;font-size:13px;color:var(--muted)}
.share a,.share button{font:inherit;font-size:14px;font-weight:700;line-height:1;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer}
.share a:hover,.share button:hover{border-color:var(--shu);color:var(--shu)}
.share a:focus-visible,.share button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.share button{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.share-text{width:100%;min-height:6em;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.memo{display:grid;gap:0}
.memo+.memo{margin-top:12px}
.memo-label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--shu)}
.cands.evt div{grid-template-columns:minmax(0,1fr) auto}
.cands.evt small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.cands.evt div:not(.hit) span:first-child{color:var(--muted)}
.events{list-style:none;margin:2px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:6px}
.events li{position:relative;display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:8px;font-size:15px;line-height:1.5}
.events li::before{content:"";position:absolute;left:-20px;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--shu)}
.events li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}

/* 英語表示のときは見出しの字間を詰め、ラベル欄を広げる */
:root[lang="en"] .row{grid-template-columns:92px 1fr}
:root[lang="en"] .row dt{letter-spacing:0;font-size:15px}
:root[lang="en"] .roll{letter-spacing:.06em}
:root[lang="en"] .ledger-title,:root[lang="en"] .calc h2,:root[lang="en"] .history h2{letter-spacing:.04em}
:root[lang="en"] .seal{writing-mode:horizontal-tb;font-size:12px;letter-spacing:.04em}

@media (max-width:460px){header{position:relative;padding-top:38px}.lang{position:absolute;top:0;right:0}}
@media (max-width:460px){.row,:root[lang="en"] .row{grid-template-columns:1fr;gap:2px}.row dd{padding-right:0}.row:first-child dd{padding-right:64px}.seal{width:54px;height:54px;font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

        <line x1="32" y1="26" x2="32" y2="4"/><line x1="32" y1="38" x2="32" y2="60"/>

      </g>
    </svg>
    <div class="title">
      <h1 data-en="Rebirth Gacha">輪廻ガチャ</h1>
      <p class="sub" data-en="Draw your next life, with odds based on real-world statistics">現実の統計にもとづいた確率で、次の生を引く</p>

  <div class="modes" role="tablist">

  <p class="intro" id="intro"></p>

  <div class="opts" id="lifeOpts" hidden>
    <div class="funnel" role="radiogroup">
      <label class="lv trunk" data-i="0"><input type="radio" name="scope" id="scope-all" value="all" checked><span><b data-en="All life">全生物</b><small id="lv-all"></small></span></label>

      <label class="lv br" data-r="2" id="br-mammal"><input type="radio" name="scope" id="scope-mammal" value="mammal"><span><b data-en="Mammals">哺乳類</b><small id="lv-mammal"></small></span></label>

      <label class="lv tip" id="br-primate"><input type="radio" name="scope" id="scope-primate" value="primate"><span><b data-en="Primates">霊長類</b><small id="lv-primate"></small></span></label>
    </div>
    <div class="scope-info" id="scopeInfo" aria-live="polite"></div>

  return {...pk,band,d};
}

function erf(x){const s=Math.sign(x);x=Math.abs(x);const t1=1/(1+.3275911*x);return s*(1-(((((1.061405429*t1-1.453152027)*t1)+1.421413741)*t1-.284496736)*t1+.254829592)*t1*Math.exp(-x*x));}

function PhiInv(p){let lo=-8,hi=8;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(Phi(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function poisson(l){const L0=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L0);return k-1;}

/* 出来事：年齢つきの判定。その年齢まで生きていない場合は判定しない */
function drawEvents(k,sex,death){
  const d=clamp((k.e0-55)/29,0,1), [gdp,gini,tfr]=ECON[k.name], E=[];
  const add=(id,p,age,extra={})=>{const alive=death>=age, r=Math.random(); const ev={id,p,age,alive,happened:alive&&r<p,...extra}; E.push(ev); return ev;};
  const twinP=["西アフリカ","中部アフリカ"].includes(k.region)?.025:k.region==="東アジア"?.008:.014;
  add("twin",twinP,0);
  const school=add("school",.55+.45*d,12);
  const uni=school.happened?add("uni",.04+.5*d**1.5,22):null;
  const mAge=clamp(21+9*d-(sex==="f"?2:0)+randn()*3.5,16,45);
  const marry=add("marry",.93-.2*d,mAge);
  // 子ども：結婚していれば 出生率×0.95÷結婚する確率、していなければ出生率×0.1 を平均とするポアソン分布
  if(death>=18){
    const lam=marry.happened?tfr*.95/(.93-.2*d):tfr*.1, n=poisson(lam), ages=[];
    let a0=marry.happened?mAge+1+Math.random()*2:22+Math.random()*10;
    for(let i=0;i<n;i++){ if(a0<=Math.min(death,sex==="f"?45:55)) ages.push(a0); a0+=1.5+Math.random()*3; }
    E.push({id:"kids",lam,n,ages,happened:ages.length>0,alive:true,p:1-Math.exp(-lam),age:ages[0]??99});
  }
  const dests=DEST.filter(x=>x[0]!==k.name);
  add("migrate",.035,18+Math.random()*22,{dest:pickWeighted(dests,x=>x[2]).item});
  add("conflict",CONFLICT.has(k.name)?.35:.02,Math.random()*death);
  add("disaster",HAZARD.has(k.name)?.35:.12,Math.random()*death);
  add("lightning",1/15300*Math.min(death,80)/80,10+Math.random()*Math.max(0,death-10));
  add("billion",1/3e6,40+Math.random()*30);
  // めずらしい体験（生涯で一度でも起きる確率の概算）
  add("eclipse",.05,8+Math.random()*Math.max(1,death-8));
  add("aurora",["北欧"].includes(k.region)||["カナダ","ロシア"].includes(k.name)?.5:.03,15+Math.random()*Math.max(1,death-15));
  add("holeinone",.0005+.004*d,30+Math.random()*30);
  add("lottery",1e-5,25+Math.random()*50);
  // 100歳を迎える確率は寿命モデルから計算（乱数ではなく、実際の寿命で判定）
  const m=calibrate(k,sex), p100=(1-m.q5)*Math.exp(-H(100,m.M,m.c));
  E.push({id:"century",p:p100,age:100,alive:death>=100,happened:death>=100});
  return {E,school,uni,d};
}

function drawMoreEvents(k,sex,death,ev,inc){
  const d=ev.d, E=ev.E, rand=(lo,hi)=>lo+Math.random()*Math.max(0,hi-lo);
  const add=(id,p,age,extra={})=>{ if(!(p>0)) return; const alive=death>=age; E.push({id,p,age,alive,happened:alive&&Math.random()<p,...extra}); };
  // 身の回り
  add("clover",.25,rand(5,40));
  add("wallet",k.name==="日本"?.35:.08+.1*d,rand(15,Math.max(16,death)));
  add("blood",.1+.3*d,rand(18,60));
  add("rescue",.02,rand(15,Math.max(16,death)));
  add("halley",.3,2061-2026);
  add("tv",.05+.15*d,rand(5,Math.max(6,death)));
  add("book",.002+.01*d,rand(25,75));
  // 挑戦
  add("space",1e-7+2e-6*d,rand(30,60));
  add("everest",1e-6,rand(25,50));
  add("antarctica",.0002+.002*d,rand(25,70));
  add("olympics",2e-5,rand(18,30));
  add("guinness",1e-5,rand(15,70));
  // 仕事（主に働いた人だけ）
  if(inc.works&&inc.years>0){
    const job=inc.pj.item[0], w=()=>rand(inc.start,inc.end);
    add("startup",job==="経営者・起業家"?.8:.03+.04*d,w());
    add("abroadwork",.02+.04*d,w());
    add("patent",["エンジニア・IT技術者","研究者"].includes(job)?.05:.001,w());
    add("award",.12,w());
    add("bankrupt",.06,w());
    add("nobel",job==="研究者"?5e-5:0,rand(45,Math.max(46,inc.end+10)));
    // 年収が10,000,000円を超える確率は、収入モデル（対数正規分布）から計算し、実際の年収で判定する
    const median=inc.annual/inc.indiv, mu=Math.log(median)-inc.sigma*inc.sigma/2, th=1e7/YEN;
    const p=1-Phi((Math.log(th)-mu)/inc.sigma);
    if(p>1e-9) E.push({id:"highpay",p,age:inc.start+Math.min(15,inc.years/2),alive:true,happened:inc.annual>=th});
  }
  // 家族
  const kids=E.find(e=>e.id==="kids"), marry=E.find(e=>e.id==="marry");
  if(kids&&kids.ages.length) add("twinsparent",.02,kids.ages[Math.min(1,kids.ages.length-1)]);
  if(marry&&marry.happened) add("golden",.6,marry.age+50);
  if(kids&&kids.ages.length) add("greatgrand",.6,kids.ages[0]+50);
}

/* 生涯収入 = 平均年収 × 性別 × 学歴 × 職業 × 個人差 × 働いた年数 × 働けた割合 */
function drawEarnings(k,sex,death,ev){
  const [gdp,gini]=ECON[k.name], d=ev.d, uni=!!(ev.uni&&ev.uni.happened), school=ev.school.happened;
  const base=gdp*.85;
  const gap=sex==="f"?.8:1;
  const edu=uni?1.25:school?1:.8;
  const level=uni?2:school?1:0;
  const start=uni?22:school?18:14, end=Math.min(Math.floor(death),65), years=Math.max(0,end-start);
  // 主に働いたかどうか：就業率で判定
  const part=sex==="m"?.9:LOW_FLFP.has(k.region)?.3:.6+.15*d, u=Math.random(), works=u<part;
  // 職業：1人あたりGDP（$800〜$50,000 を対数で0〜1に）で重みを混ぜ、学歴と性別で調整
  const si=sex==="m"?0:1, dj=clamp(Math.log(gdp/800)/Math.log(50000/800),0,1);
  const jw=j=>{let w=j[2]*(1-dj)+j[3]*dj; if(j[5]>level) w*=j[5]===2&&level===1?.05:0; if(level===2) w*=j[7]?.3:j[5]===2?4:1.5; return w*j[6][si];};
  const pj=pickWeighted(JOBS,jw), avg=JOBS.reduce((s,j)=>s+jw(j)*j[4],0)/pj.total, occ=pj.item[4]/avg;
  const sigma=Math.SQRT2*PhiInv((gini/100+1)/2)*.8, z=randn(), indiv=Math.exp(sigma*z-sigma*sigma/2);
  const share=works?.9:.1; // 働いた人も失業・休職で1割は働かない／働かなかった人も1割は働く
  const annual=base*gap*edu*(works?occ:.6)*indiv, total=annual*share*years;
  return {gdp,gini,base,gap,part,u,works,edu,pj,dj,occ,sigma,z,indiv,start,end,years,share,annual,total,top:1-Phi(z),home:HOME[sex==="f"?0:1]};
}
function rankText(top,cn){
  return top<=.5 ? t(`${cn}の働く人の中で上位 ${pct(top)}`,`top ${pct(top)} of workers in ${cn}`) : t(`${cn}の働く人の中で下位 ${pct(1-top)}`,`bottom ${pct(1-top)} of workers in ${cn}`);
}
function money(usd,big){
  if(usd<1) return t("0円","$0");
  const yen=usd*YEN;
  return big
    ? t(`約${fmtN(yen)}円<span class="note">約${fmtN(usd)}ドル（1ドル=${YEN}円）</span>`,`about $${fmtN(usd)}<span class="note">about ¥${fmtN(yen,false)} (at ¥${YEN} per dollar)</span>`)
    : t(`約${fmtN(yen)}円（約${fmtN(usd)}ドル）`,`about $${fmtN(usd,false)} (¥${fmtN(yen,false)})`);
}
function evAgeLabel(a){return a<1?t("誕生","Birth"):t(Math.floor(a)+"歳","Age "+Math.floor(a));}
function timeline(rec){
  const {ev}=rec, items=[];
  for(const e of ev.E){
    if(e.id==="kids"){ e.ages.forEach((a,i)=>items.push([a,t(`第${i+1}子が誕生`,`Child #${i+1} born`)])); continue; }
    if(e.id==="school"&&e.alive&&!e.happened){ items.push([12,t("小学校を卒業できなかった","Did not finish primary school")]); continue; }
    if(!e.happened) continue;
    let label=t(...EV_NAME[e.id]);
    if(e.id==="migrate") label=t(e.dest[0]+"へ移住","Moved to "+e.dest[1]);
    items.push([e.age,label]);
  }
  const inc=rec.inc;
  if(inc&&inc.works&&inc.years>0) items.push([inc.start,t(jobName(inc.pj.item)+"として働き始める","Started work: "+jobName(inc.pj.item))]);
  items.sort((a,b)=>a[0]-b[0]);
  if(!items.length) return `<span class="note">${t("大きな出来事はありませんでした","No major life events")}</span>`;
  return `<ol class="events">`+items.map(([a,l])=>`<li><span>${evAgeLabel(a)}</span><span>${l}</span></li>`).join("")+`</ol>`;
}
function eventTable(rec){
  return `<div class="cands evt">`+rec.ev.E.map(e=>{
    let res;
    if(e.id==="kids") res=e.ages.length?t(e.ages.length+"人",e.ages.length+(e.ages.length===1?" child":" children")):t("いない","none");
    else if(!e.alive) res=t("その年齢まで生きなかった","didn't live that long");
    else res=e.happened?t("起きた","happened"):t("起きなかった","didn't happen");
    const name=e.id==="kids"?t(`子ども（平均 ${e.lam.toFixed(1)}人）`,`Children (average ${e.lam.toFixed(1)})`):t(...EV_NAME[e.id]);
    const p=e.p>=.001?pct(e.p):prob(e.p);
    return `<div class="${e.happened?"hit":""}"><span>${name}<small>${t("確率","chance")} ${p}</small></span><span>${res}</span></div>`;
  }).join("")+`</div>`;
}

function drawHuman(){

  const sx=sexOf(k), ps=pickWeighted(["m","f"],s=>s==="m"?sx.pm:1-sx.pm), sex=ps.item;
  const a=sampleAge(k,sex), pd=causeOf(a.age,k,sex);
  const ev=drawEvents(k,sex,a.age), inc=drawEarnings(k,sex,a.age,ev);
  drawMoreEvents(k,sex,a.age,ev,inc);

}
function drawLife(){
  const scope=curScope(), P=[...pool(scope)].sort((a,b)=>b.n-a.n), pk=pickWeighted(P,x=>x.n);

}

function row(label,html,i){return `<div class="row reveal" style="animation-delay:${i*.35}s"><dt>${label}</dt><dd>${html}</dd></div>`;}
function step(title,body){return `<li><div><h3>${title}</h3>${body}</div></li>`;}
function candList(pk,label,limit){
  const max=Math.max(...pk.ws);
  let list=pk.ws.map((w,i)=>({w,i})).filter(o=>o.w>0).sort((a,b)=>b.w-a.w);
  if(limit){ const hit=list.find(o=>o.i===pk.idx); list=list.slice(0,limit); if(hit&&!list.includes(hit)) list.push(hit); }
  return `<div class="cands">`+list.map(({w,i})=>{
    const p=w/pk.total;
    return `<div class="${i===pk.idx?"hit":""}"><span>${label(i)}<i><u style="width:${Math.max(.5,w/max*100)}%"></u></i></span><span>${p>=1e-5?pct(p):prob(p)}</span></div>`;
  }).join("")+`</div>`;
}

}

const INTRO={
  human:["世界の出生数から生まれる国が、その国の出生性比から性別が決まります。そこから人生の出来事、生涯収入、寿命、死因を、その国の統計をもとに引きます。",
         "Your country comes from worldwide birth counts and your sex from that country's sex ratio at birth. Your life events, lifetime earnings, lifespan and cause of death are then drawn from that country's statistics."],
  life:["地球上の推定個体数の割合で、次に何に生まれるかが決まります。範囲を狭めると、少しは人間に近づけます。",
        "What you come back as depends on each creature's share of Earth's estimated population. Narrow the range to edge a little closer to being human."]
};
const FOOT={
  human:["出生数・平均寿命・5歳未満死亡率・出生率は2023年前後の国連推計、1人あたりGDP・ジニ係数は世界銀行の値をもとにした概算です。死因・人生の出来事・生涯収入は、これらをもとにした簡易モデルです。",
         "Births, life expectancy, under-5 mortality and fertility are rough figures based on UN estimates from around 2023; GDP per person and Gini come from World Bank figures. Causes of death, life events and lifetime earnings use simple models built on these."],
  life:["個体数は研究ごとに数桁ずれる概算です。全生物にはウイルスも含めています。ウイルスと微生物の数は群を抜いて多いので、全生物ではほぼ確実にウイルスか細菌になります。",
        "Populations are rough estimates that can differ by several orders of magnitude between studies. “All life” includes viruses. Viruses and microbes vastly outnumber everything else, so under “All life” you will almost certainly become a virus or a bacterium."]
};

const SCOPE_NAME={all:["全生物","All life"],multi:["多細胞生物","Multicellular life"],animal:["動物","Animals"],vert:["脊椎動物","Vertebrates"],
  fish:["魚類","Fish"],mammal:["哺乳類","Mammals"],bird:["鳥類","Birds"],primate:["霊長類","Primates"]};
const scopeTotal=s=>pool(s).reduce((a,e)=>a+e.n,0);
function updateFunnel(){
  const cur=curScope(), path=PATH[cur], branched=path.length>4;
  Object.keys(PATH).forEach(s=>{
    $("lv-"+s).textContent="10"+sup(Math.round(Math.log10(scopeTotal(s))));
    const lv=$("scope-"+s).closest(".lv");
    lv.classList.toggle("passed",path.includes(s)&&s!==cur);
    lv.classList.toggle("off",branched&&!path.includes(s));
  });
  $("spine").classList.toggle("on",branched);
  ["fish","mammal","bird"].forEach(c=>$("br-"+c).classList.toggle("on",path.includes(c)));
  $("br-primate").classList.toggle("on",cur==="primate");
  const P=pool(cur), tt=scopeTotal(cur), h=P.find(e=>e.name==="人間");
  $("scopeInfo").innerHTML=`<b>${t(...SCOPE_NAME[cur])}</b><span>${t("分母 約","Total: about ")}${fmtN(tt)}</span><span>${h?t("人間に生まれる確率 ","Chance of being human: ")+prob(h.n/tt):t("この範囲に人間はいません","No humans in this range")}</span>`;
}
const TRUNK=["all","multi","animal","vert"];
const PATH={all:TRUNK.slice(0,1),multi:TRUNK.slice(0,2),animal:TRUNK.slice(0,3),vert:TRUNK,
  fish:[...TRUNK,"fish"],bird:[...TRUNK,"bird"],mammal:[...TRUNK,"mammal"],primate:[...TRUNK,"mammal","primate"]};

function renderHistory(){
  const h=hist[mode]; $("historySec").hidden=!h.length;
  $("history").innerHTML=h.map(([n,rec])=>{const [a,b]=summary(rec);return `<li><span>${n}</span><span>${a}</span><span>${b}</span></li>`}).join("");
}
function renderTable(){
  let rows,total;
  if(mode==="human"){ rows=[...C].sort((a,b)=>b.births-a.births).map(c=>({label:cName(c),n:c.births})); total=birthsTotal;
    $("tableSummary").textContent=t("国ごとの確率表を見る","Show odds by country"); }
  else { const P=pool(); total=P.reduce((s,e)=>s+e.n,0); rows=[...P].sort((a,b)=>b.n-a.n).map(e=>({label:look(e).emoji+" "+lName(e),n:e.n}));
    $("tableSummary").textContent=t("生き物ごとの確率表を見る","Show odds by creature"); }
  const max=Math.log10(rows[0].n/total*1e40);
  $("tbl").innerHTML=rows.map(r=>{
    const p=r.n/total, w=mode==="human"?p/(rows[0].n/total)*100:clamp(Math.log10(p*1e40)/max*100,1,100);
    return `<div class="tr"><div>${r.label}<div class="bar"><i style="width:${w}%"></i></div></div><div class="p">${prob(p)}</div></div>`;
  }).join("");
}
/* ---------- シェア ---------- */
const SHARE_URL="https://b0bisore.com/game/rinne-gacha/";
const plain=html=>html.replace(/<span class="(digits|en|note)">.*?<\/span>/g,"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function shareText(rec){
  const head=t("輪廻ガチャで転生したら…","I got reborn on Rebirth Gacha…"), tags=t("#輪廻ガチャ","#RebirthGacha");
  if(rec.type==="human"){
    const cn=cName(rec.k), sx=sexName(rec.sex), age=ageText(rec.a.age), cause=causeName(rec.pd.item[0]), m=plain(money(rec.inc.total));
    const inc=rec.inc, job=inc.works&&inc.years>0?jobName(inc.pj.item):null;
    return `${head}\n${t(`${cn}の${sx}に生まれ、${job?job+"として働き、":""}${age}で亡くなりました（${cause}）。生涯収入は${m}。いちばん幸せだったのは「${rec.mem.happy.item.ja}」。`,
      `Born ${sx.toLowerCase()} in ${cn}${job?", worked as: "+job:""}; died at ${age} (${cause}). Lifetime earnings: ${m}. Happiest moment: ${rec.mem.happy.item.en}.`)}\n${tags}`;
  }
  return `${head}\n${t(`「${lName(rec.pk.item)}」に生まれ変わりました（確率 ${plain(prob(rec.pk.p))}）。`,`I came back as: ${lName(rec.pk.item)} (odds ${plain(prob(rec.pk.p))}).`)}\n${tags}`;
}
function renderShare(rec){
  $("share").hidden=!rec; $("sh-text").hidden=true;
  $("sh-copy").textContent=t("文章をコピー","Copy text");
  if(!rec) return;
  const text=shareText(rec), full=text+"\n"+SHARE_URL, e=encodeURIComponent;
  $("sh-x").href=`https://twitter.com/intent/tweet?text=${e(text)}&url=${e(SHARE_URL)}`;
  $("sh-line").href=`https://line.me/R/share?text=${e(full)}`;
  $("sh-fb").href=`https://www.facebook.com/sharer/sharer.php?u=${e(SHARE_URL)}`;
  $("sh-threads").href=`https://www.threads.net/intent/post?text=${e(full)}`;
  $("sh-bsky").href=`https://bsky.app/intent/compose?text=${e(full)}`;
  $("sh-text").value=full;
}
$("sh-copy").onclick=()=>{
  track("share",{mode,result:"copy"});
  const box=$("sh-text"), btn=$("sh-copy");
  const fallback=()=>{box.hidden=false;box.focus();box.select();btn.textContent=t("下の文章を選択しました。コピーしてください","Text selected below — copy it");};
  try{
    navigator.clipboard.writeText(box.value).then(()=>{btn.textContent=t("コピーしました","Copied");},fallback);
  }catch(err){fallback();}
};

function renderCurrent(animate){
  const rec=current[mode];
  renderShare(rec);
  if(!rec){
    $("result").innerHTML=`<p class="placeholder">${t("ボタンを押すと、次の"+(mode==="human"?"人生":"生")+"が記帳されます。","Press the button to record your next "+(mode==="human"?"life":"form of life")+" in the ledger.")}</p>`;
    $("seal").hidden=true; $("calcSec").hidden=true; return;
  }
  mode==="human"?renderHuman(rec,animate):renderLife(rec,animate);
  $("seal").hidden=false;
}
function renderAll(){
  document.documentElement.lang=lang;
  document.title=t("輪廻ガチャ","Rebirth Gacha");
  document.querySelectorAll("[data-en]").forEach(el=>{el.textContent=t(el.dataset.ja,el.dataset.en);});
  $("lang-ja").setAttribute("aria-pressed",lang==="ja"); $("lang-en").setAttribute("aria-pressed",lang==="en");
  $("tab-human").setAttribute("aria-selected",mode==="human"); $("tab-life").setAttribute("aria-selected",mode==="life");
  $("lifeOpts").hidden=mode!=="life";
  $("intro").textContent=t(...INTRO[mode]); $("foot").textContent=t(...FOOT[mode]);
  $("ledgerNo").textContent=t("第 "+rolls[mode]+" 回","No. "+rolls[mode]);
  updateFunnel(); renderCurrent(false); renderHistory(); renderTable();
}

function roll(){
  const btn=$("roll"); btn.disabled=true;
  const w=$("wheel"); w.classList.remove("spin"); void w.offsetWidth; w.classList.add("spin");
  $("seal").hidden=true; $("calcSec").hidden=true; $("share").hidden=true;
  $("result").innerHTML=`<p class="placeholder">${t("魂が旅立っています…","Your soul is on its way…")}</p>`;
  const delay=matchMedia("(prefers-reduced-motion: reduce)").matches?0:700;
  setTimeout(()=>{
    const rec=mode==="human"?drawHuman():drawLife();
    current[mode]=rec; rolls[mode]++;
    if(!played){ played=true; track("play_start",{mode}); }
    track("rebirth",rec.type==="human"
      ?{mode:"human",result:rec.k.name,detail:(rec.sex==="m"?"男性":"女性")+"・"+Math.floor(rec.a.age)+"歳・"+(rec.inc.works&&rec.inc.years>0?rec.inc.pj.item[0]:"仕事なし")}
      :{mode:"life",result:rec.pk.item.name,detail:SCOPE_NAME[rec.scope][0]});
    hist[mode].unshift([rolls[mode],rec]); hist[mode]=hist[mode].slice(0,10);
    $("ledgerNo").textContent=t("第 "+rolls[mode]+" 回","No. "+rolls[mode]);
    renderCurrent(true);
    const s=$("seal"); s.classList.remove("stamp"); void s.offsetWidth; s.classList.add("stamp");
    renderHistory(); btn.disabled=false;
  },delay);
}
function setLang(l){ if(l!==lang) track("lang_switch",{result:l}); lang=l; try{localStorage.setItem("rinne-lang",l);}catch(e){} renderAll(); }

document.querySelectorAll("[data-en]").forEach(el=>{el.dataset.ja=el.textContent;});
$("tab-human").onclick=()=>{if(mode!=="human")track("mode_switch",{mode:"human"});mode="human";renderAll();};
$("tab-life").onclick=()=>{if(mode!=="life")track("mode_switch",{mode:"life"});mode="life";renderAll();};
[["sh-x","x"],["sh-line","line"],["sh-fb","facebook"],["sh-threads","threads"],["sh-bsky","bluesky"]].forEach(([id,m])=>$(id).addEventListener("click",()=>track("share",{mode,result:m})));
$("lang-ja").onclick=()=>setLang("ja");
$("lang-en").onclick=()=>setLang("en");
$("roll").onclick=roll;
document.querySelectorAll('input[name="scope"]').forEach(r=>r.onchange=()=>{updateFunnel();renderTable();});
renderAll();
track("page_view");
</script>

</body>
