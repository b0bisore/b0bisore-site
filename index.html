<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOB'S GAMES</title>
<meta name="description" content="ぼぶがつくった無料ブラウザゲーム置き場。">
<link rel="canonical" href="https://b0bisore.com/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 1列のゲーム一覧。ゲームが増えたら <li> を足す */
:root{--paper:#E9ECF1;--surface:#F8F9FB;--ink:#1B2232;--muted:#454D61;--line:#CCD2DD;--shu:#B3302A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0F121A;--surface:#171B26;--ink:#E6E8EE;--muted:#B6BCC9;--line:#2A3041;--shu:#E2705C;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;word-break:auto-phrase}
main{max-width:560px;margin:0 auto;padding:40px 16px 64px}
h1{font:800 34px/1.2 "Shippori Mincho B1","Yu Mincho",serif;margin:0 0 24px;letter-spacing:.04em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--shu)}
a.card:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
a.card img{width:56px;height:56px;border-radius:8px;object-fit:cover}
a.card b{display:block;font-size:17px}
a.card span{display:block;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>BOB'S GAMES</h1>
  <ul>
    <li><a class="card" href="/game/rinne-gacha/">
      <img src="/game/rinne-gacha/og.png" alt="">
      <div><b>輪廻ガチャ</b><span>現実の統計にもとづいた確率で、次に何に生まれ変わるかを引く</span></div>
    </a></li>
  </ul>
</main>
</body>
</html>
